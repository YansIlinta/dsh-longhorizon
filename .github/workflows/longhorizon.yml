name: longhorizon (standalone)

# Standalone build + test + pack verification for `@deepseek-ai/dsh-longhorizon`.
# The npm publish itself is owned by the DeepSeek Harness monorepo release
# pipeline; this lane proves the standalone package builds, tests, and packs
# on its own.
#
# `npm pack --dry-run --ignore-scripts` (with a temporary, writable npm cache)
# verifies the publish surface matches `exports`/`files` without uploading
# anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-test-pack:
    name: Build · test · pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build (tsc -b && tsdown)
        run: pnpm run build

      - name: Test (vitest)
        run: pnpm test

      - name: Verify publish surface (npm pack dry-run, no upload)
        run: |
          npm pack --dry-run --ignore-scripts --cache "$RUNNER_TEMP/npm-cache" \
            --pack-destination "$RUNNER_TEMP" .